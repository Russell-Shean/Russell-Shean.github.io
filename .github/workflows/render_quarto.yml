name: Render quarto and move to top level
on:
  push:
    branches:
      - main

  # run on request (via button in actions menu)
  workflow_dispatch:
      
jobs:
  deploy:
    name: render quarto

    # allow skipping deployment for commits containing '[automated]' or '[no-deploy]' in the commit message
    if: "!contains(github.event.head_commit.message, '[automated]') && !contains(github.event.head_commit.message, '[no-deploy]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # Install R
      - uses: r-lib/actions/setup-r@v2

      # Install all the linux dependencies chat gpt told me I need for the spatial packages
      - run: |
          sudo apt-get update
          sudo apt-get install -y \
          libudunits2-dev \
          libgdal-dev \
          libgeos-dev \
          libproj-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libpng-dev \
          libtiff5-dev \
          libjpeg-dev \
          libxml2-dev \
          libcurl4-openssl-dev \
          libssl-dev \
          libprotobuf-dev \
          protobuf-compiler \
          libjq-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libglu1-mesa-dev \
          freeglut3-dev \
          mesa-common-dev
      
      # Install Dependent R packages
      - run: Rscript -e 'install.packages(c("DT", "rmarkdown", "knitr", "tmap","tmaptools","sf"))'

      
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: |
          quarto --version
          quarto add qmd-lab/closeread --no-prompt
      - uses: quarto-dev/quarto-actions/render@v2
      # copy all the rendered files into the main directory
      # there has to be a less stupid way to do this....
      - run: |
          cp -a _site/. .
          
      # commit back to repo
      - uses: stefanzweifel/git-auto-commit-action@v5
